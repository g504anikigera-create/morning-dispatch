<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morning Dispatch — 世界のニュースで学ぶ英語</title>
<meta name="description" content="世界のニュースの“事実”をもとに、ビジネス英語・イディオム・上級語彙を毎朝1本、日本語で深掘り解説。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#F4F1EA; --card:#FBF9F4; --ink:#17282B; --ink-soft:#4A5C5F; --ink-faint:#8A9698;
    --teal:#0F6E6B; --teal-deep:#0A4E4C; --amber:#B26A00; --amber-soft:#E9B44C;
    --line:#E3DDD0; --line-strong:#CFC7B4; --danger:#9B2C2C;
    --shadow:0 1px 2px rgba(23,40,43,.05), 0 8px 24px rgba(23,40,43,.06); --maxw:720px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px 60px;}

  /* PR bar (ステマ規制対応・ファーストビューに明示) */
  .prbar{background:var(--teal-deep);color:#EAF3F2;text-align:center;font-size:12px;padding:7px 16px;letter-spacing:.02em;}

  .masthead{padding:24px 0 18px;border-bottom:1.5px solid var(--ink);margin-bottom:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);margin-bottom:6px;}
  .masthead h1{font-family:"Newsreader",serif;font-weight:600;font-size:26px;line-height:1.1;margin:0;letter-spacing:-.01em;}
  .date{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-soft);margin-top:8px;}
  .toolbar{display:flex;gap:8px;flex-shrink:0;}
  .icon-btn{appearance:none;border:1px solid var(--line-strong);background:var(--card);width:40px;height:40px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:border-color .15s,color .15s;}
  .icon-btn:hover{border-color:var(--teal);color:var(--teal);}
  .icon-btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .icon-btn svg{width:19px;height:19px;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:24px;box-shadow:var(--shadow);display:none;}
  .panel.open{display:block;}
  .panel h2{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin:0 0 14px;font-weight:500;}
  .hist-item{display:flex;flex-direction:column;gap:2px;padding:11px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;}
  .hist-item:hover{background:var(--paper);border-color:var(--line);}
  .hist-item .h-date{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--teal);}
  .hist-item .h-title{font-family:"Newsreader",serif;font-size:15px;color:var(--ink);}
  .hist-empty{font-size:13px;color:var(--ink-faint);padding:4px 2px;}

  .kicker{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:12px;display:flex;gap:10px;align-items:center;}
  .kicker .badge{background:var(--amber);color:#fff;padding:2px 8px;border-radius:5px;letter-spacing:.1em;font-size:10px;}
  .headline-en{font-family:"Newsreader",serif;font-weight:600;font-size:33px;line-height:1.12;letter-spacing:-.015em;margin:0 0 10px;}
  .headline-ja{font-size:15px;color:var(--ink-soft);margin:0 0 16px;font-weight:500;}
  .source-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-faint);padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .source-row a{color:var(--teal);text-decoration:none;border-bottom:1px solid var(--line-strong);}
  .source-row a:hover{border-color:var(--teal);}

  .section-label{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin:32px 0 12px;display:flex;align-items:center;gap:10px;}
  .section-label::after{content:"";height:1px;background:var(--line);flex:1;}
  .prose{font-size:15.5px;color:var(--ink);}
  .why{background:rgba(15,110,107,.06);border-left:3px solid var(--teal);padding:12px 16px;border-radius:0 8px 8px 0;font-size:14.5px;color:var(--ink-soft);}

  .expr{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:20px 20px 18px;margin-bottom:16px;box-shadow:var(--shadow);}
  .expr-type{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);border:1px solid var(--teal);border-radius:5px;padding:2px 7px;display:inline-block;margin-bottom:12px;}
  .expr-en{font-family:"Newsreader",serif;font-weight:500;font-size:25px;line-height:1.2;margin:0;display:inline;background-image:linear-gradient(transparent 62%, var(--amber-soft) 62%);background-size:100% 100%;padding:0 1px;}
  .expr-reading{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-faint);margin:8px 0 12px;}
  .expr-ja{font-size:15px;font-weight:500;margin:12px 0 8px;color:var(--ink);}
  .expr-nuance{font-size:14px;color:var(--ink-soft);margin:0 0 14px;}
  .expr-ex{background:var(--paper);border-radius:10px;padding:12px 14px;}
  .expr-ex .ex-en{font-family:"Newsreader",serif;font-size:16px;font-style:italic;color:var(--ink);margin:0 0 4px;}
  .expr-ex .ex-ja{font-size:13px;color:var(--ink-soft);margin:0;}

  .takeaway{background:var(--ink);color:#EDEAE0;border-radius:14px;padding:22px;margin-top:8px;}
  .takeaway .section-label{color:var(--amber-soft);margin-top:0;}
  .takeaway .section-label::after{background:rgba(255,255,255,.14);}
  .takeaway .prose{color:#DCE3E2;font-size:15px;}
  .practice{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.13);}
  .practice .p-en{font-family:"Newsreader",serif;font-size:18px;font-style:italic;color:#fff;margin:0 0 6px;}
  .practice .p-ja{font-size:13px;color:#B9C4C3;margin:0;}

  .loading{text-align:center;padding:70px 20px;}
  .pulse{width:44px;height:44px;margin:0 auto 22px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--teal);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading .stage{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--teal);}
  .loading .sub{font-size:12.5px;color:var(--ink-faint);margin-top:8px;}

  .notice{border:1px solid var(--line-strong);background:var(--card);border-radius:14px;padding:24px;margin-top:8px;}
  .notice h3{font-family:"Newsreader",serif;font-size:20px;margin:0 0 10px;}
  .notice p{font-size:14px;color:var(--ink-soft);margin:0;}

  footer{max-width:var(--maxw);margin:40px auto 0;padding:22px 20px 40px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-faint);}
  footer .links{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;}
  footer a{color:var(--teal);text-decoration:none;}
  footer a:hover{text-decoration:underline;}
  footer .fine{line-height:1.7;}

  @media (max-width:520px){.headline-en{font-size:27px;}.expr-en{font-size:22px;}.masthead h1{font-size:22px;}.wrap{padding:0 16px 40px;}}
  @media (prefers-reduced-motion:reduce){.pulse{animation-duration:2.4s;}*{transition:none !important;}}
</style>
</head>
<body>
<div class="prbar">本サイトは広告（アフィリエイト）を含みます（PR）</div>
<div class="wrap">
  <header class="masthead">
    <div>
      <div class="eyebrow">Morning Dispatch</div>
      <h1>世界のニュースで学ぶ英語</h1>
      <div class="date" id="dateLabel">—</div>
    </div>
    <div class="toolbar">
      <button class="icon-btn" id="btnHistory" title="これまでのレッスン" aria-label="これまでのレッスン">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="icon-btn" id="btnReload" title="再読み込み" aria-label="再読み込み">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
      </button>
    </div>
  </header>

  <section class="panel" id="historyPanel">
    <h2>これまでのレッスン</h2>
    <div id="historyList"></div>
  </section>

  <main id="content" aria-live="polite">
    <div class="loading"><div class="pulse"></div><div class="stage">本日の教材を読み込み中…</div></div>
  </main>
</div>

<footer>
  <div class="links">
    <a href="about.html" id="lnkAbout">運営者情報</a>
    <a href="privacy.html" id="lnkPrivacy">プライバシーポリシー</a>
    <a href="contact.html" id="lnkContact">お問い合わせ</a>
  </div>
  <div class="fine">
    本サイトはアフィリエイト広告（PR）を含みます。<br/>
    掲載する解説は、報道された事実とごく短い引用に基づく当サイト独自の英語学習教材です。各ニュースの著作権は各媒体に帰属します。詳細は出典元の記事をご覧ください。<br/>
    © <span id="year"></span> Morning Dispatch
  </div>
</footer>

<script>
/* ============================================================
   ▼ ここだけ設定：デプロイした Worker のURL
   例: https://morning-dispatch.＜あなたのサブドメイン＞.workers.dev
   ============================================================ */
const WORKER_URL = "https://morning-dispatch.g504-aniki-gera.workers.dev";

const $ = s => document.querySelector(s);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function prettyDate(s){
  if(!s) return "—";
  const [y,m,d]=s.split("-").map(Number);
  const wd=["日","月","火","水","木","金","土"][new Date(y,m-1,d).getDay()];
  return `${y}.${String(m).padStart(2,"0")}.${String(d).padStart(2,"0")} (${wd})`;
}

async function loadToday(){
  showLoading();
  try{
    const res = await fetch(WORKER_URL + "/today", { cache:"no-store" });
    if(!res.ok){
      const e = await res.json().catch(()=>({}));
      throw new Error(e.error || `HTTP ${res.status}`);
    }
    render(await res.json());
  }catch(err){ renderError(err); }
}

async function loadDate(date){
  showLoading();
  try{
    const res = await fetch(WORKER_URL + "/lesson?date=" + encodeURIComponent(date), { cache:"no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    render(await res.json());
    $("#historyPanel").classList.remove("open");
  }catch(err){ renderError(err); }
}

async function loadHistory(){
  try{
    const res = await fetch(WORKER_URL + "/list", { cache:"no-store" });
    const idx = res.ok ? await res.json() : [];
    const list = $("#historyList");
    if(!idx.length){ list.innerHTML = '<div class="hist-empty">まだ履歴はありません。</div>'; return; }
    list.innerHTML = idx.map(x =>
      `<div class="hist-item" data-date="${esc(x.date)}"><span class="h-date">${esc(prettyDate(x.date))}</span><span class="h-title">${esc(x.headline_en||x.headline_ja||"")}</span></div>`
    ).join("");
    list.querySelectorAll(".hist-item").forEach(el => el.addEventListener("click", () => loadDate(el.dataset.date)));
  }catch(e){}
}

function showLoading(){
  $("#content").innerHTML = '<div class="loading"><div class="pulse"></div><div class="stage">読み込み中…</div></div>';
}

function render(o){
  $("#dateLabel").textContent = prettyDate(o.date);
  const exprs = Array.isArray(o.expressions) ? o.expressions : [];
  const exprHtml = exprs.map(x => `
    <article class="expr">
      <span class="expr-type">${esc(x.type||"EXPRESSION")}</span><br/>
      <h3 style="margin:0;"><span class="expr-en">${esc(x.en)}</span></h3>
      ${x.reading_note ? `<div class="expr-reading">${esc(x.reading_note)}</div>` : ""}
      <p class="expr-ja">${esc(x.ja)}</p>
      ${x.nuance_ja ? `<p class="expr-nuance">${esc(x.nuance_ja)}</p>` : ""}
      ${x.example_en ? `<div class="expr-ex"><p class="ex-en">${esc(x.example_en)}</p>${x.example_ja?`<p class="ex-ja">${esc(x.example_ja)}</p>`:""}</div>` : ""}
    </article>`).join("");

  $("#content").innerHTML = `
    <div class="kicker"><span class="badge">Today</span> Today's Topic</div>
    <h2 class="headline-en">${esc(o.headline_en)}</h2>
    ${o.headline_ja ? `<p class="headline-ja">${esc(o.headline_ja)}</p>` : ""}
    <div class="source-row">
      <span>出典：${esc(o.source_name||"")}</span>
      ${o.source_url ? `<span>·</span><a href="${esc(o.source_url)}" target="_blank" rel="noopener">元記事を読む ↗</a>` : ""}
    </div>
    ${o.facts_ja ? `<div class="section-label">今日の出来事</div><p class="prose">${esc(o.facts_ja)}</p>` : ""}
    ${o.why_important_ja ? `<div class="why">${esc(o.why_important_ja)}</div>` : ""}
    <div class="section-label">今日の表現</div>
    ${exprHtml || '<p class="prose">表現が取得できませんでした。</p>'}
    <div class="takeaway">
      ${o.takeaway_ja ? `<div class="section-label">今日のひとこと</div><p class="prose">${esc(o.takeaway_ja)}</p>` : ""}
      ${o.practice_en ? `<div class="practice"><p class="p-en">${esc(o.practice_en)}</p>${o.practice_ja?`<p class="p-ja">${esc(o.practice_ja)}</p>`:""}</div>` : ""}
    </div>`;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderError(err){
  $("#content").innerHTML = `
    <div class="notice">
      <h3>本日の教材はまだ準備中です</h3>
      <p>しばらくしてから再度お試しください。（${esc(err && err.message ? err.message : String(err))}）</p>
    </div>`;
}

document.getElementById("year").textContent = new Date().getFullYear();
$("#btnHistory").addEventListener("click", () => { $("#historyPanel").classList.toggle("open"); loadHistory(); });
$("#btnReload").addEventListener("click", loadToday);
loadToday();
</script>
</body>
</html>
